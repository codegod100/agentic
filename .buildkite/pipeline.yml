# Radicle Garden → Buildkite pipeline for the agentic mirror.
# GitHub (codegod100/agentic) is the source of truth; this job fast-forwards
# the Radicle repo weekly so garden stays in sync.
#
# Schedule: run scripts/setup-buildkite-schedule.sh once after the pipeline
# exists in Buildkite (created automatically on the first push with this file).
#
# Required Buildkite secrets (pipeline or cluster env):
#   RADICLE_GARDEN_EMAIL, RADICLE_GARDEN_PASSWORD
# Optional:
#   GITHUB_TOKEN — higher GitHub API rate limits during fetch

env:
  GITHUB_UPSTREAM_URL: "https://github.com/codegod100/agentic.git"
  UPSTREAM_BRANCH: "main"
  RADICLE_BRANCH: "main"

steps:
  - label: ":github: Mirror from GitHub upstream"
    key: mirror
    if: build.source == "schedule" || build.env("FORCE_MIRROR") == "true"
    agents:
      queue: "default"
    commands:
      - test -n "$RADICLE_GARDEN_EMAIL" -a -n "$RADICLE_GARDEN_PASSWORD" || (echo "RADICLE_GARDEN_EMAIL and RADICLE_GARDEN_PASSWORD must be set in Buildkite" && exit 1)
      - chmod +x scripts/mirror-from-github.sh
      - ./scripts/mirror-from-github.sh

  - label: ":pipeline: Pipeline loaded"
    key: noop
    if: build.source != "schedule" && build.env("FORCE_MIRROR") != "true"
    commands:
      - echo "Push build — mirror runs on schedule (Mondays 06:17 UTC) or with FORCE_MIRROR=true"
