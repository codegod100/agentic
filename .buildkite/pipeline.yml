# Buildkite-only pipeline for agentic weekly upstream checks.
# Trigger via Buildkite schedule or API (FORCE_UPDATE=true) — not GitHub Actions.
#
# When packages are outdated, opens/updates a Radicle patch on
# rad:z6BdNEojb6XZcor7SMkYpXn45Zp8 (does not push to GitHub).
#
# Required Buildkite env/secrets for patch publishing:
#   RAD_PASSPHRASE
# Optional: RADICLE_SECRET_KEY + RADICLE_PUBLIC_KEY (persistent DID)
# Optional: GITHUB_TOKEN (API rate limits)
#
# Register schedule: BUILDKITE_API_TOKEN=… ./scripts/setup-buildkite-schedule.sh

steps:
  - label: ":nix: Check packages → Radicle patch if outdated"
    key: update
    if: build.source == "schedule" || build.env("FORCE_UPDATE") == "true"
    agents:
      queue: "auto"
    timeout_in_minutes: 120
    commands:
      - chmod +x scripts/buildkite-run-update.sh scripts/update-packages.sh
      - ./scripts/buildkite-run-update.sh
