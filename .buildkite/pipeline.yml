# Buildkite-only pipeline for agentic weekly upstream checks.
# Trigger via Buildkite schedule or API (FORCE_UPDATE=true) — not GitHub Actions.
#
# Register schedule: BUILDKITE_API_TOKEN=… ./scripts/setup-buildkite-schedule.sh
# Manual: curl Buildkite builds API with env FORCE_UPDATE=true

steps:
  - label: ":nix: Check packages against upstream"
    key: update
    if: build.source == "schedule" || build.env("FORCE_UPDATE") == "true"
    agents:
      queue: "auto"
    timeout_in_minutes: 90
    commands:
      - chmod +x scripts/buildkite-run-update.sh scripts/update-packages.sh
      - ./scripts/buildkite-run-update.sh
