name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            accept-flake-config = true

      - name: List package attrs
        id: list
        run: |
          set -euo pipefail
          system="$(nix eval --raw --impure --expr 'builtins.currentSystem')"
          packages="$(
            nix eval --json ".#packages.${system}" --apply 'builtins.attrNames' \
              | jq -c '[.[] | select(. != "default" and . != "update")] | sort'
          )"
          count="$(jq 'length' <<<"$packages")"
          if [ "$count" -eq 0 ]; then
            echo "error: no packages found for ${system}" >&2
            exit 1
          fi
          echo "Found ${count} packages for ${system}: $(jq -r 'join(", ")' <<<"$packages")"
          echo "packages=${packages}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.package }}
    needs: discover
    runs-on: ubuntu-latest
    # Ladybird / Skia are long compiles; keep headroom for cold caches.
    # With NIXBUILD_TOKEN set, compiles offload to nixbuild.net (much faster).
    timeout-minutes: 360
    env:
      # Job-level env so steps can branch on token presence (secrets.* not allowed in if:).
      NIXBUILD_TOKEN: ${{ secrets.NIXBUILD_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            accept-flake-config = true

      - name: Setup nixbuild.net
        if: env.NIXBUILD_TOKEN != ''
        uses: nixbuild/nixbuild-action@v25
        with:
          nixbuild_token: ${{ env.NIXBUILD_TOKEN }}
          generate_summary_for: job

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: codegod100
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Pull always. Push from main and same-repo PRs (so matrix jobs can
          # share e.g. skia → ladybird). Fork PRs stay pull-only.
          skipPush: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Require Cachix write token on main
        if: github.ref == 'refs/heads/main'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "${CACHIX_AUTH_TOKEN}" ]; then
            echo "::error::Repository secret CACHIX_AUTH_TOKEN is not set. Create a write token for the codegod100 Cachix cache and add it under Settings → Secrets → Actions so merges can push binaries."
            exit 1
          fi

      - name: Build .#${{ matrix.package }} (nixbuild remote store)
        if: env.NIXBUILD_TOKEN != ''
        run: |
          set -euo pipefail
          pkg='${{ matrix.package }}'
          results="$(mktemp)"
          # Remote-store build: schedule on nixbuild.net without shipping
          # inputs through the GHA runner (much faster for large packages).
          nix build --print-build-logs --json \
            --eval-store auto \
            --store ssh-ng://nixbuild \
            --builders "" \
            --max-jobs 2 \
            ".#${pkg}" | tee "$results"
          mapfile -t paths < <(jq -r '.[].outputs | to_entries[].value' "$results")
          if [ "${#paths[@]}" -eq 0 ]; then
            echo "error: nix build produced no outputs for .#${pkg}" >&2
            exit 1
          fi
          # Bring closure onto the runner so cachix-action can push it.
          nix copy --from ssh-ng://nixbuild --to auto "${paths[@]}"
          nix path-info -rS "${paths[@]}" | tail -n 20

      - name: Build .#${{ matrix.package }}
        if: env.NIXBUILD_TOKEN == ''
        run: |
          echo "::warning::NIXBUILD_TOKEN secret is not set; building on the GitHub runner (slow for ladybird/skia). Add a nixbuild.net auth token as repository secret NIXBUILD_TOKEN."
          nix build --no-link --print-build-logs ".#${{ matrix.package }}"

  # Single status gate for branch rules / auto-merge ("CI success").
  ci-success:
    name: CI success
    needs: [discover, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require discover + all matrix builds
        run: |
          set -euo pipefail
          echo "discover=${{ needs.discover.result }} build=${{ needs.build.result }}"
          test "${{ needs.discover.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
