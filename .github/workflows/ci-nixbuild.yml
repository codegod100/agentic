# Fast package builds via nixbuild.net (remote store), then push to Cachix.
#
# Auth (either works):
#   1. GitHub secret NIXBUILD_TOKEN, or
#   2. GitHub secret OPENBAO_TOKEN / BAO_TOKEN that can read
#      secret/data/ai-api-keys → NIXBUILD_TOKEN (and optional CACHIX_AUTH_TOKEN)
#
# OpenBao defaults: BAO_ADDR=https://openbao.boxd.sh
name: CI nixbuild

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      packages:
        description: 'JSON array of package attrs to build (empty = ladybird+skia)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-nixbuild-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            accept-flake-config = true

      - name: List package attrs
        id: list
        env:
          MANUAL_PACKAGES: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          if [ -n "${MANUAL_PACKAGES}" ]; then
            packages="$(jq -c . <<<"${MANUAL_PACKAGES}")"
          else
            # Default: the expensive packages that benefit most from nixbuild.
            system="$(nix eval --raw --impure --expr 'builtins.currentSystem')"
            all="$(
              nix eval --json ".#packages.${system}" --apply 'builtins.attrNames' \
                | jq -c '[.[] | select(. != "default" and . != "update")] | sort'
            )"
            packages="$(jq -c '[.[] | select(. == "ladybird" or . == "skia")]' <<<"$all")"
            # If those attrs are missing (rename), fall back to full set.
            if [ "$(jq 'length' <<<"$packages")" -eq 0 ]; then
              packages="$all"
            fi
          fi
          count="$(jq 'length' <<<"$packages")"
          if [ "$count" -eq 0 ]; then
            echo "error: no packages selected" >&2
            exit 1
          fi
          echo "Building ${count} package(s) on nixbuild.net: $(jq -r 'join(", ")' <<<"$packages")"
          echo "packages=${packages}" >> "$GITHUB_OUTPUT"

  build:
    name: nixbuild ${{ matrix.package }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - name: Load tokens (GitHub secret or OpenBao ai-api-keys)
        id: tokens
        env:
          NIXBUILD_TOKEN_SECRET: ${{ secrets.NIXBUILD_TOKEN }}
          CACHIX_AUTH_TOKEN_SECRET: ${{ secrets.CACHIX_AUTH_TOKEN }}
          OPENBAO_TOKEN: ${{ secrets.OPENBAO_TOKEN || secrets.BAO_TOKEN || secrets.VAULT_TOKEN }}
          BAO_ADDR: ${{ secrets.BAO_ADDR || secrets.OPENBAO_ADDR || secrets.VAULT_ADDR || 'https://openbao.boxd.sh' }}
        run: |
          set -euo pipefail
          nixbuild_token="${NIXBUILD_TOKEN_SECRET:-}"
          cachix_token="${CACHIX_AUTH_TOKEN_SECRET:-}"

          if [ -z "$nixbuild_token" ] || [ -z "$cachix_token" ]; then
            if [ -z "${OPENBAO_TOKEN:-}" ]; then
              echo "::error::Need NIXBUILD_TOKEN GitHub secret, or OPENBAO_TOKEN/BAO_TOKEN to read secret/data/ai-api-keys from OpenBao."
              exit 1
            fi
            addr="${BAO_ADDR%/}"
            echo "Fetching missing CI tokens from OpenBao ${addr} (secret/data/ai-api-keys)"
            json="$(curl -fsS -H "X-Vault-Token: ${OPENBAO_TOKEN}" "${addr}/v1/secret/data/ai-api-keys")"
            if [ -z "$nixbuild_token" ]; then
              nixbuild_token="$(jq -r '.data.data.NIXBUILD_TOKEN // empty' <<<"$json")"
            fi
            if [ -z "$cachix_token" ]; then
              cachix_token="$(jq -r '.data.data.CACHIX_AUTH_TOKEN // empty' <<<"$json")"
            fi
          fi

          if [ -z "$nixbuild_token" ]; then
            echo "::error::NIXBUILD_TOKEN not found in GitHub secrets or OpenBao secret/data/ai-api-keys"
            exit 1
          fi

          echo "::add-mask::${nixbuild_token}"
          {
            echo "nixbuild_token<<EOF"
            echo "${nixbuild_token}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$cachix_token" ]; then
            echo "::add-mask::${cachix_token}"
            {
              echo "cachix_auth_token<<EOF"
              echo "${cachix_token}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            accept-flake-config = true

      - name: Setup nixbuild.net
        uses: nixbuild/nixbuild-action@v25
        with:
          nixbuild_token: ${{ steps.tokens.outputs.nixbuild_token }}
          generate_summary_for: job

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: codegod100
          authToken: ${{ steps.tokens.outputs.cachix_auth_token || secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Build .#${{ matrix.package }} on nixbuild.net
        run: |
          set -euo pipefail
          pkg='${{ matrix.package }}'
          results="$(mktemp)"
          nix build --print-build-logs --json \
            --eval-store auto \
            --store ssh-ng://nixbuild \
            --builders "" \
            --max-jobs 2 \
            ".#${pkg}" | tee "$results"
          mapfile -t paths < <(jq -r '.[].outputs | to_entries[].value' "$results")
          if [ "${#paths[@]}" -eq 0 ]; then
            echo "error: nix build produced no outputs for .#${pkg}" >&2
            exit 1
          fi
          echo "Built paths:"
          printf '  %s\n' "${paths[@]}"
          nix copy --from ssh-ng://nixbuild --to auto "${paths[@]}"
          nix path-info -rS "${paths[@]}" | tail -n 30
